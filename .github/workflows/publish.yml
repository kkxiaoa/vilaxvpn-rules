name: Publish VPN rules

on:
  push:
    branches: [main]
    paths:
      - direct-ip.json
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-rules-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install verified sing-box compiler
        env:
          SING_BOX_VERSION: 1.14.4
          SING_BOX_SHA256: 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968
        run: |
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 180 \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$SING_BOX_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-${SING_BOX_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - name: Compile and verify exact IP ranges
        run: python3 scripts/build.py
      - name: Publish compiled files for CDN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publish_dir="$RUNNER_TEMP/vpn-rules-publish"
          if git show-ref --verify --quiet refs/remotes/origin/rule-set; then
            git worktree add --detach "$publish_dir" refs/remotes/origin/rule-set
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan rule-set
            git -C "$publish_dir" rm -r --ignore-unmatch .
          fi
          cp -a dist/. "$publish_dir/"
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Publish rules from ${GITHUB_SHA}"
            git -C "$publish_dir" push origin HEAD:rule-set
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
